<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <text x="70" y="66" font-family="Arial, sans-serif" font-size="13" letter-spacing="4" fill="#2dd4bf" font-weight="600">WEEK 05 · AI AGENTS &amp; TOOL CALLING</text>

  <text x="68" y="126" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#f8fafc">AI Research Agent</text>

  <rect x="70" y="148" width="190" height="4" rx="2" fill="url(#accent)"/>

  <text x="70" y="186" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Plans research, calls tools, gathers evidence, and reports its findings.</text>

  <g font-family="'Courier New', monospace" font-size="12.5" fill="#cbd5e1">
    <text x="70" y="228">Tool Calling</text>
    <circle cx="185" cy="224" r="2" fill="#2dd4bf" opacity="0.6"/>
    <text x="200" y="228">Task Decomposition</text>
    <circle cx="360" cy="224" r="2" fill="#2dd4bf" opacity="0.6"/>
    <text x="375" y="228">Source Evaluation</text>
  </g>

  <!-- agent loop icon: plan -> act -> observe cycle, larger + clearer -->
  <g transform="translate(985, 55)">
    <rect x="0" y="0" width="160" height="180" rx="14" fill="#f1f5f9" opacity="0.035" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.45"/>

    <!-- orbit ring -->
    <circle cx="80" cy="88" r="52" fill="none" stroke="#1e293b" stroke-width="10"/>
    <circle cx="80" cy="88" r="52" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>

    <!-- three cycle nodes: plan / act / observe -->
    <g>
      <circle cx="80" cy="36" r="9" fill="#0f1720" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="80" cy="36" r="3" fill="#38bdf8"/>
    </g>
    <g>
      <circle cx="124" cy="112" r="9" fill="#0f1720" stroke="#2dd4bf" stroke-width="2.5"/>
      <circle cx="124" cy="112" r="3" fill="#2dd4bf"/>
    </g>
    <g>
      <circle cx="36" cy="112" r="9" fill="#0f1720" stroke="#2dd4bf" stroke-width="2.5"/>
      <circle cx="36" cy="112" r="3" fill="#2dd4bf"/>
    </g>

    <!-- direction arrow on the loop -->
    <path d="M112 46 L120 40 L119 50" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- center core -->
    <circle cx="80" cy="88" r="14" fill="#0f1720" stroke="#f1f5f9" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="80" cy="88" r="5" fill="#38bdf8"/>

    <text x="80" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" letter-spacing="2" fill="#64748b">AGENT LOOP</text>
  </g>

  <rect x="0" y="298" width="1200" height="2" fill="url(#accent)" opacity="0.5"/>
</svg>
